<div class="kitcord-shell">

  <header class="topbar">
    <div class="brand">
      <img src="assets/images/logo.png" alt="Kitcord Logo" class="brand-logo">
      <h1>Kitcord</h1>
    </div>

    <div class="topbar-actions">
      <button [routerLink]="['/login']" mat-button>
        Login
      </button>

      <button [routerLink]="['/register']" color="primary" mat-flat-button>
        Registrieren
      </button>
    </div>
  </header>

  <main class="landing-page">

    <section class="hero-card">

      <img src="assets/images/logo.png" alt="Kitcord Logo" class="hero-logo">

      <h2>Willkommen bei Kitcord</h2>

      <p>
        Deine moderne Chat-App für Freunde, Gruppen und Communitys.
      </p>

      <div class="hero-buttons">
        <button [routerLink]="['/login']" color="primary" mat-flat-button>
          Login
        </button>

        <button [routerLink]="['/register']" mat-stroked-button>
          Registrieren
        </button>
      </div>

    </section>

  </main>

</div>
