<div class="no-access-page">

  <div class="no-access-card">

    <mat-icon class="warning-icon">
      warning_amber
    </mat-icon>

    <h1>Zugriff verweigert</h1>

    <p>
      Du besitzt nicht die erforderlichen Berechtigungen,
      um auf diese Seite zuzugreifen.
    </p>

    @if (!oauthService.hasValidAccessToken()) {
      <div class="login-container">
        <app-login></app-login>
      </div>
    }

  </div>

</div>
