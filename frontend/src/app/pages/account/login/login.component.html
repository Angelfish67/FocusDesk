<div class="auth-page">
  <section class="auth-card">
    <img src="assets/images/logo.png" alt="Kitcord Logo" class="auth-logo">

    <h1>Willkommen zurück</h1>
    <p>Melde dich direkt über Keycloak an.</p>

    <button
      class="auth-submit"
      color="primary"
      mat-flat-button
      type="button"
      (click)="login()"
    >
      <mat-icon>login</mat-icon>
      Mit Keycloak anmelden
    </button>

    <p class="auth-switch">
      Noch kein Konto?
      <a routerLink="/register">Jetzt registrieren</a>
    </p>
  </section>
</div>
