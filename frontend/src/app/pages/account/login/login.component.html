<div class="auth-page">
  <section class="auth-card">
    <img src="assets/images/logo.png" alt="Kitcord Logo" class="auth-logo">

    <h1>Willkommen zurück</h1>
    <p>Melde dich an und öffne deine Chats.</p>

    <form class="auth-form" (ngSubmit)="login()">
      <mat-form-field appearance="outline">
        <mat-label>Benutzername</mat-label>
        <input
          matInput
          name="username"
          type="text"
          [(ngModel)]="username"
          placeholder="Benutzername"
        >
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Passwort</mat-label>
        <input
          matInput
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Passwort"
        >
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }

      <button class="auth-submit" color="primary" mat-flat-button type="submit" [disabled]="loading">
        {{ loading ? 'Wird angemeldet...' : 'Login' }}
      </button>
    </form>

    <p class="auth-switch">
      Noch kein Konto?
      <a routerLink="/register">Jetzt registrieren</a>
    </p>
  </section>
</div>
