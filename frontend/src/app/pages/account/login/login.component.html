<div class="auth-page">
  <section class="auth-card">
    <img
      src="assets/images/logo.png"
      alt="Kitcord Logo"
      class="auth-logo"
    >

    <h1>Willkommen bei Kitcord</h1>

    <p class="auth-description">
      Melde dich mit deinem Keycloak-Konto an, um auf deine Chats zuzugreifen.
    </p>

    <button
      class="auth-submit"
      color="primary"
      mat-flat-button
      type="button"
      (click)="login()"
    >
      <mat-icon>login</mat-icon>
      Mit Keycloak anmelden
    </button>
  </section>
</div>
