<div class="auth-page">
  <section class="auth-card">
    <img src="assets/images/logo.png" alt="Kitcord Logo" class="auth-logo">

    <h1>Konto erstellen</h1>
    <p>Registriere dich direkt über Keycloak.</p>

    <button class="auth-submit" color="primary" mat-flat-button type="button" (click)="register()">
      <mat-icon>person_add</mat-icon>
      Mit Keycloak registrieren
    </button>

    <p class="auth-switch">
      Bereits ein Konto?
      <a routerLink="/login">Zum Login</a>
    </p>
  </section>
</div>
