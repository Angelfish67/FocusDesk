<div class="auth-page">
  <section class="auth-card">
    <img src="assets/images/logo.png" alt="Kitcord Logo" class="auth-logo">

    <h1>Konto erstellen</h1>
    <p>Registriere dich und starte mit Kitcord.</p>

    <form class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Benutzername</mat-label>
        <input matInput type="text" placeholder="Dein Name">
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>E-Mail</mat-label>
        <input matInput type="email" placeholder="name@example.com">
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Passwort</mat-label>
        <input matInput type="password" placeholder="Mindestens 8 Zeichen">
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Passwort bestätigen</mat-label>
        <input matInput type="password" placeholder="Passwort wiederholen">
        <mat-icon matSuffix>verified_user</mat-icon>
      </mat-form-field>

      <button class="auth-submit" color="primary" mat-flat-button type="submit">
        Registrieren
      </button>
    </form>

    <p class="auth-switch">
      Bereits ein Konto?
      <a [routerLink]="['/login']">Zum Login</a>
    </p>
  </section>
</div>
