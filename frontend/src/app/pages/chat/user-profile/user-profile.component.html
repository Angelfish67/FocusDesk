<div class="user-profile">

  <div class="avatar">
    {{ initials }}
  </div>

  <div class="user-info">
    <div class="username">
      {{ username }}
    </div>

    <div class="status">
      <span class="status-dot"></span>
      {{ status }}
    </div>
  </div>

  <button class="settings-button" type="button" (click)="logout()">
    <mat-icon>logout</mat-icon>
  </button>

</div>
