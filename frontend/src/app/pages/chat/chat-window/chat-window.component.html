<section class="chat-window">

  <header class="chat-header">
    <div class="chat-title">
      <mat-icon>
        {{ selectedChat?.chatType === 'GROUP' ? 'groups' : 'forum' }}
      </mat-icon>

      <span>{{ selectedChat?.name || 'Kein Chat ausgewählt' }}</span>
    </div>

    @if (canOpenAdmin) {
      <div class="chat-header-actions">
        <button
          mat-raised-button
          color="warn"
          type="button"
          (click)="openAdmin()"
        >
          <mat-icon>admin_panel_settings</mat-icon>
          Admin
        </button>
      </div>
    }
  </header>

  @if (errorMessage) {
    <div class="chat-error">
      {{ errorMessage }}
    </div>
  }

  <app-message-list
    [messages]="messages"
    [loading]="loadingMessages">
  </app-message-list>

  @if (canSendMessage) {
    <div class="message-input">
      <input
        type="text"
        placeholder="Nachricht schreiben..."
        [(ngModel)]="messageText"
        [minLength]="minMessageLength"
        [maxLength]="maxMessageLength"
        [disabled]="!selectedChat || sendingMessage"
        (keydown.enter)="sendMessage()"
      >

      <button
        mat-icon-button
        color="primary"
        type="button"
        [disabled]="!selectedChat || !messageText.trim() || sendingMessage || messageText.trim().length > maxMessageLength"
        (click)="sendMessage()"
      >
        <mat-icon>send</mat-icon>
      </button>
    </div>
  }

</section>
