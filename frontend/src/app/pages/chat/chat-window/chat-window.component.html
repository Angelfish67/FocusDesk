<section class="chat-window">

  <header class="chat-header">
    <div class="chat-title">
      <mat-icon>
        {{ selectedChat?.chatType === 'GROUP' ? 'groups' : 'forum' }}
      </mat-icon>

      <span>{{ selectedChat?.name || 'Kein Chat ausgewählt' }}</span>
    </div>
  </header>

  @if (errorMessage) {
    <div class="chat-error">
      {{ errorMessage }}
    </div>
  }

  <app-message-list
    [messages]="messages"
    [loading]="loadingMessages">
  </app-message-list>

  <div *appHasRole="['update', 'admin']" class="message-input">
    <input
      type="text"
      placeholder="Nachricht schreiben..."
      [(ngModel)]="messageText"
      [disabled]="!selectedChat || sendingMessage"
      (keydown.enter)="sendMessage()"
    >

    <button
      mat-icon-button
      color="primary"
      type="button"
      [disabled]="!selectedChat || !messageText.trim() || sendingMessage"
      (click)="sendMessage()"
    >
      <mat-icon>send</mat-icon>
    </button>
  </div>

</section>
