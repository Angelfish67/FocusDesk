<aside class="sidebar">

  <div class="sidebar-header">
    <img src="assets/images/logo.png" alt="Kitcord">
    <span>Kitcord</span>
  </div>

  <div class="sidebar-section">

    <div class="section-title">
      <h4>Chats</h4>

      <button
        *appHasRole="['ROLE_UPDATE', 'ROLE_ADMIN', 'update', 'admin']"
        class="create-button"
        type="button"
        (click)="toggleCreateChat()"
      >
        <mat-icon>add</mat-icon>
      </button>
    </div>

    @if (showCreateChat) {
      <div *appHasRole="['ROLE_UPDATE', 'ROLE_ADMIN', 'update', 'admin']" class="create-chat-box">

        <input
          type="text"
          placeholder="Chatname"
          [(ngModel)]="chatName"
          [minLength]="minChatNameLength"
          [maxLength]="maxChatNameLength"
        >

        <select [(ngModel)]="chatType">
          <option value="GROUP">Gruppenchat</option>
          <option value="DIRECT">Direktchat</option>
        </select>

        <input
          type="text"
          placeholder="Andere User-IDs, z.B. 2, 3"
          [(ngModel)]="userIdsInput"
          [maxLength]="maxUserIdsLength"
        >

        @if (currentUserId) {
          <div
            class="create-chat-info-message"
            style="color: #38bdf8; background-color: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.45); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; line-height: 1.4;"
          >
            Deine eigene User-ID {{ currentUserId }} wird automatisch hinzugefügt.
          </div>
        }

        @if (errorMessage) {
          <p class="error-message">{{ errorMessage }}</p>
        }

        <button
          class="save-chat-button"
          type="button"
          (click)="createChat()"
          [disabled]="loading"
        >
          {{ loading ? 'Wird geladen...' : 'Chat erstellen' }}
        </button>

      </div>
    }

    @if (!showCreateChat && errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    @for (chat of chats; track chat.id) {
      <button
        class="chat-item"
        type="button"
        [class.active]="selectedChat?.id === chat.id"
        (click)="selectChat(chat)"
      >
        <mat-icon>
          {{ chat.chatType === 'GROUP' ? 'groups' : 'person' }}
        </mat-icon>

        <span>{{ chat.name || 'Unbenannter Chat' }}</span>
      </button>
    }

  </div>

  <app-user-profile></app-user-profile>

</aside>
